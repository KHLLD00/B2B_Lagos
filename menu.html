<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menu — B2B Breakfast 2 Breakfast</title>
<meta name="description" content="Browse the full B2B menu and order for pickup or delivery.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<header class="site-header">
  <div class="wrap header-inner">
    <a href="index.html" class="logo">
      <span class="logo-mark">B2B</span>
    </a>
    <nav class="main-nav" id="main-nav">
      <a href="menu.html">Menu</a>
      <a href="index.html#story">Our story</a>
      <a href="index.html#hours">Hours &amp; location</a>
    </nav>
    <a href="cart.html" class="cart-link" aria-label="View cart">
      <i class="cart-icon"></i>
      <span class="cart-count" id="cart-count" hidden>0</span>
    </a>
    <a href="cart.html" class="btn btn-primary header-cta">View order</a>
    <button class="nav-toggle" id="nav-toggle" aria-label="Toggle navigation" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </div>
</header>

<main>
  <section class="menu-intro">
    <div class="wrap">
      <h1>The full menu</h1>
      <p>Pickup and delivery, all day, every day. Bar items are available for dine-in only.</p>
    </div>
  </section>

  <div class="menu-controls-wrap">
    <div class="wrap">
      <div class="search-bar">
        <i class="search-icon"></i>
        <input type="text" id="menu-search" placeholder="Search the menu" aria-label="Search the menu">
      </div>
      <div class="category-tabs" id="category-tabs"></div>
    </div>
  </div>

  <section class="menu-list">
    <div class="wrap">
      <p class="empty-state" id="empty-state" hidden>Nothing matches that search. Try a different word, or browse by category instead.</p>
      <div id="menu-sections"></div>
    </div>
  </section>
</main>

<footer class="site-footer">
  <div class="wrap footer-inner">
    <span class="logo-mark small">B2B</span>
    <p>&copy; <span id="year"></span> B2B &mdash; Breakfast 2 Breakfast, Lagos.</p>
  </div>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/fuse.js/6.6.2/fuse.min.js"></script>
<script src="js/cart.js"></script>
<script src="js/menu.js"></script>
<script src="js/main.js"></script>
</body>
</html>
